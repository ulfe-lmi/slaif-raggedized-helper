[project]
name = "slaif-cpu-worker-profile"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["torch==2.10.0+cpu", "transformers==4.51.3", "tokenizers==0.21.4", "safetensors==0.5.3", "huggingface-hub==0.30.2", "numpy==2.2.6", "pydantic==2.14.3"]

[tool.uv]
package = false
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
