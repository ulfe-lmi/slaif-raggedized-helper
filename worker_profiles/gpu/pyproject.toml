[project]
name = "slaif-gpu-worker-profile"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["torch==2.14.0+cu126", "transformers==5.22.2", "tokenizers==0.23.1", "safetensors==0.8.0", "huggingface-hub==1.31.0", "pydantic==2.14.3", "numpy==2.5.4"]

[tool.uv]
package = false
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
