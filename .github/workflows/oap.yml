# OAP scaffold CI — objective 000-a. Covers the OAP scaffold only (governance tests,
# protocol harness, check_state); no product code, models, GPU or network services.
# Read-only, no secrets, GitHub-hosted runners only, immutable action SHA pins.
# Objective 002-a adds a separate minimal product job (locked lightweight
# environment, real product tests plus OAP checks, lint). It still uses no keys,
# secrets, GPUs or live services; the three governance jobs are unchanged.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  oap-tests:
    name: OAP tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # Fail loudly if runner tooling is missing; the DHA signature tests must
      # never be silently skipped on a runner without ssh-keygen. (Availability gate
      # only: ssh-keygen has no portable --help; behavior is exercised by the suite.)
      - name: Check required local tools
        run: |
          command -v git >/dev/null
          command -v ssh-keygen >/dev/null
          git --version

      - name: Python syntax check
        run: python -m compileall -q oap tests

      # Synthetic fixtures only: no keys, network, GPU, tmux or model downloads.
      - name: OAP test suite
        run: python -m unittest discover -s tests/oap -v

      # Governance/identity check against this exact checkout (active order included).
      - name: OAP governance check
        run: python oap/bin/check_state.py --repo-root "$GITHUB_WORKSPACE"

  # Objective 002-a: minimal separate product job. Installs the locked lightweight
  # environment (no heavy ML stack), runs the real product tests plus the existing
  # OAP checks from a clean checkout, and lints the product scope. No keys,
  # secrets, GPUs or live services; synthetic fixtures only.
  product-tests:
    name: Product tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # The committed .python-version is the development default; CI pins the
      # matrix interpreter explicitly so each leg builds the lock on its own Python.
      - name: Select matrix interpreter
        run: echo "${{ matrix.python-version }}" > .python-version

      - name: Install uv (pinned, standard registry)
        run: python -m pip install --upgrade "uv==0.12.5"

      - name: Install locked lightweight environment
        run: uv sync --locked --no-progress

      # Required reproducible native PDF development tests (order 006-a), on
      # these disposable GitHub-hosted runners only. The isolated worker is
      # fixed to /usr/bin/prlimit + /usr/bin/bwrap with working user/PID/net/
      # IPC/UTS namespaces, a trusted standalone CPython 3.12 runtime and a
      # NEW private pinned hash-verified package graph. Missing or
      # incompatible prerequisites fail this job; a skipped PDF test is not a
      # pass and there is no unsandboxed fallback.
      - name: Install and verify PDF isolation tools (runner only)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          test -x /usr/bin/prlimit
          bwrap --version
          # Functional namespace smoke mirroring the fixed worker unshare
          # set, run unprivileged as the runner user.
          bwrap --unshare-user --unshare-pid --unshare-net --unshare-ipc \
            --unshare-uts --ro-bind / / true
          # The fixed worker argv also binds /usr/lib64, which merged-usr
          # hosts may lack; an empty stub is inert there (the dynamic loader
          # searches /usr/lib/x86_64-linux-gnu and worker packages load from
          # the private /packages mount).
          test -d /usr/lib64 || sudo mkdir -m 755 /usr/lib64

      - name: Provision standalone CPython 3.12 worker runtime
        run: |
          uv python install 3.12
          runtime="$(find "$(uv python dir)" -maxdepth 1 -type d \
            -name 'cpython-3.12.*-linux-x86_64-gnu' | sort | tail -n 1)"
          test -x "$runtime/bin/python3.12"
          "$runtime/bin/python3.12" -c 'import sys; sys.exit(0 if sys.version_info[:2] == (3, 12) else 1)'
          printf 'PDF_TEST_RUNTIME=%s\n' "$runtime" >> "$GITHUB_ENV"

      - name: Provision new private hash-verified PDF test backend
        run: |
          set -o pipefail
          target="$RUNNER_TEMP/pdf-test-backend-new"
          test ! -e "$target"
          python3 tests/support/prepare_pdf_test_backend.py \
            --runtime-dir "$PDF_TEST_RUNTIME" --target "$target" | tee pdf-backend-setup.log
          # The helper's printed export lines are shell-oriented; GITHUB_ENV
          # takes literal NAME=value entries only, so bind the known private
          # package path explicitly (never source or eval helper output).
          printf 'PDF_TEST_PACKAGES=%s/lib/python3.12/site-packages\n' "$target" >> "$GITHUB_ENV"

      # Required reproducible native tokenizer development tests (order
      # 006-b), on these disposable GitHub-hosted runners only. The isolated
      # session worker reuses the verified /usr/bin/prlimit + /usr/bin/bwrap
      # unshare set (plus /usr/bin/timeout), the same trusted standalone
      # CPython 3.12 runtime and a NEW private pinned hash-verified
      # engine-only tokenizers 0.21.4 capsule. Missing or incompatible
      # prerequisites fail this job; a skipped native test is not a pass and
      # there is no unsandboxed fallback.
      - name: Provision new private hash-verified native tokenizer test backend
        run: |
          set -o pipefail
          target="$RUNNER_TEMP/native-test-backend-new"
          test ! -e "$target"
          python3 tests/support/prepare_native_test_backend.py \
            --runtime-dir "$PDF_TEST_RUNTIME" --target "$target" | tee native-backend-setup.log
          # The helper's printed export lines are shell-oriented; GITHUB_ENV
          # takes literal NAME=value entries only, so bind the known private
          # paths explicitly (never source or eval helper output).
          printf 'SLAIF_NATIVE_TEST_ROOT=%s\n' "$PDF_TEST_RUNTIME" >> "$GITHUB_ENV"
          printf 'SLAIF_NATIVE_TEST_PYTHON=python3.12\n' >> "$GITHUB_ENV"
          printf 'SLAIF_NATIVE_TEST_PACKAGES=%s/packages\n' "$target" >> "$GITHUB_ENV"

      - name: Lint (product scope)
        run: uv run ruff check src tests/unit tests/integration

      - name: Python syntax check
        run: python -m compileall -q oap tests

      # Real product tests from a clean, locked install. Synthetic fixtures only:
      # no keys, network, GPU or model downloads. pytest exits 5 on empty
      # discovery, so the suite cannot be falsely green.
      - name: Product test suite
        run: uv run pytest tests/unit -q

      # Real controlled HTTP/SSE behavior tests (003-b): owned 127.0.0.1
      # fixtures with unique synthetic keys; no external network, product
      # services, keys, GPU or model downloads.
      - name: Integration test suite (owned loopback HTTP/SSE)
        run: uv run pytest tests/integration -q

      # Existing OAP scaffold checks on the same clean checkout.
      - name: OAP test suite
        run: python -m unittest discover -s tests/oap -v

      - name: OAP governance check
        run: python oap/bin/check_state.py --repo-root "$GITHUB_WORKSPACE"

      # Console entry works offline.
      - name: Console help (offline)
        run: uv run raggedized --help

      # Doctor on the shipped example: syntactically valid config, honest
      # unqualified-model and absent-secret issues, exit code 1, safe JSON.
      - name: Doctor example (honest issues, offline)
        run: |
          set +e
          uv run raggedized doctor --config config/examples/example-config.json > /tmp/doctor.json
          code=$?
          set -e
          echo "doctor exit code: $code"
          [ "$code" -eq 1 ]
          python - <<'PY'
          import json
          doc = json.load(open('/tmp/doctor.json'))
          assert doc['status'] == 'issues', doc
          assert doc['config'] == 'valid', doc
          assert doc['readiness'] == 'not_ready', doc
          codes = {i['code'] for i in doc['issues']}
          assert 'MODEL_UNQUALIFIED' in codes, codes
          print('doctor example OK:', sorted(codes))
          PY
